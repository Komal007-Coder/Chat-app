<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat App</title>
    <script src="https://cdn.socket.io/4.8.4/socket.io.min.js"
        integrity="sha384-fBrXvbDtHoeKWJ/hcA6M+YGueiDW+h45I7V6F2kD1S8bOkrF9rZYPLVkCR6BLR/1"
        crossorigin="anonymous"></script>
    <style>
        :root {
            --bg: #eef1f6;
            --card: #ffffff;
            --text: #1f2430;
            --muted: #7a8194;
            --primary: #4f46e5;
            --primary-dark: #4338ca;
            --mine: #4f46e5;
            --theirs: #e9ecf3;
            --system: #fff4d6;
            --border: #e2e6ef;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .app {
            width: 100%;
            max-width: 520px;
            height: 100vh;
            max-height: 760px;
            background: var(--card);
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(31, 36, 48, .12);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        @media (max-width: 540px) {
            .app { max-height: none; border-radius: 0; }
        }

        /* Header */
        header {
            background: var(--primary);
            color: #fff;
            padding: 14px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        header h1 { font-size: 18px; font-weight: 600; }

        .status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
        }

        .dot {
            width: 10px; height: 10px; border-radius: 50%;
            background: #f87171;
        }
        .dot.on { background: #4ade80; }

        .online-badge {
            background: rgba(255, 255, 255, .2);
            padding: 3px 10px;
            border-radius: 999px;
            font-size: 12px;
        }

        /* Messages */
        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: #f8f9fc;
        }

        .msg {
            max-width: 78%;
            padding: 9px 13px;
            border-radius: 14px;
            font-size: 14.5px;
            line-height: 1.4;
            word-wrap: break-word;
        }

        .msg .name {
            display: block;
            font-size: 11.5px;
            font-weight: 600;
            margin-bottom: 2px;
            opacity: .75;
        }

        .msg .time {
            display: block;
            font-size: 10.5px;
            margin-top: 3px;
            opacity: .6;
            text-align: right;
        }

        .msg.mine {
            align-self: flex-end;
            background: var(--mine);
            color: #fff;
            border-bottom-right-radius: 4px;
        }

        .msg.theirs {
            align-self: flex-start;
            background: var(--theirs);
            border-bottom-left-radius: 4px;
        }

        .msg.system {
            align-self: center;
            background: var(--system);
            color: #6b5a1e;
            font-size: 12.5px;
            padding: 5px 12px;
            border-radius: 999px;
            max-width: 90%;
            text-align: center;
        }

        /* Input */
        form {
            display: flex;
            gap: 10px;
            padding: 12px 14px;
            border-top: 1px solid var(--border);
            background: var(--card);
        }

        form input {
            flex: 1;
            padding: 11px 14px;
            border: 1px solid var(--border);
            border-radius: 999px;
            font-size: 14.5px;
            outline: none;
            transition: border-color .15s;
        }
        form input:focus { border-color: var(--primary); }

        form button {
            background: var(--primary);
            color: #fff;
            border: none;
            padding: 0 22px;
            border-radius: 999px;
            font-size: 14.5px;
            font-weight: 600;
            cursor: pointer;
            transition: background .15s;
        }
        form button:hover { background: var(--primary-dark); }
        form button:disabled { background: #b9bdd6; cursor: not-allowed; }

        /* Name modal */
        #nameModal {
            position: fixed; inset: 0;
            background: rgba(20, 24, 38, .55);
            display: flex; align-items: center; justify-content: center;
            z-index: 10;
        }

        .modal-box {
            background: #fff;
            padding: 26px;
            border-radius: 14px;
            width: 90%;
            max-width: 340px;
            text-align: center;
        }
        .modal-box h2 { margin-bottom: 6px; font-size: 20px; }
        .modal-box p { color: var(--muted); font-size: 14px; margin-bottom: 16px; }
        .modal-box input {
            width: 100%;
            padding: 11px 14px;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 15px;
            outline: none;
            margin-bottom: 12px;
        }
        .modal-box input:focus { border-color: var(--primary); }
        .modal-box button {
            width: 100%;
            padding: 11px;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }
        .modal-box button:hover { background: var(--primary-dark); }
    </style>
</head>

<body>
    <!-- Naam poochne wala popup -->
    <div id="nameModal">
        <div class="modal-box">
            <h2>Welcome 👋</h2>
            <p>Chat shuru karne se pehle apna naam likhiye</p>
            <input id="nameInput" type="text" maxlength="20" placeholder="Aapka naam" autofocus>
            <button id="nameBtn">Chat Start Karo</button>
        </div>
    </div>

    <div class="app">
        <header>
            <h1>💬 Chat App</h1>
            <div class="status">
                <span class="online-badge" id="onlineCount">Online: -</span>
                <span class="dot" id="dot"></span>
                <span id="statusText">Connecting...</span>
            </div>
        </header>

        <div id="messages"></div>

        <form id="chatForm">
            <input id="msgInput" type="text" placeholder="Message likhiye..." autocomplete="off" disabled>
            <button id="sendBtn" type="submit" disabled>Send</button>
        </form>
    </div>

    <script>
        // ---------- Elements ----------
        const messagesEl = document.getElementById("messages");
        const chatForm = document.getElementById("chatForm");
        const msgInput = document.getElementById("msgInput");
        const sendBtn = document.getElementById("sendBtn");
        const dot = document.getElementById("dot");
        const statusText = document.getElementById("statusText");
        const onlineCount = document.getElementById("onlineCount");
        const nameModal = document.getElementById("nameModal");
        const nameInput = document.getElementById("nameInput");
        const nameBtn = document.getElementById("nameBtn");

        let username = "Guest";

        // ---------- Helpers ----------
        function timeNow() {
            return new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
        }

        function scrollBottom() {
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        // textContent use kiya hai taaki koi HTML inject na kar sake
        function addSystem(text) {
            const div = document.createElement("div");
            div.className = "msg system";
            div.textContent = text;
            messagesEl.appendChild(div);
            scrollBottom();
        }

        function addMessage(text, type, name) {
            const div = document.createElement("div");
            div.className = "msg " + type;

            if (name) {
                const n = document.createElement("span");
                n.className = "name";
                n.textContent = name;
                div.appendChild(n);
            }

            const body = document.createElement("span");
            body.textContent = text;
            div.appendChild(body);

            const t = document.createElement("span");
            t.className = "time";
            t.textContent = timeNow();
            div.appendChild(t);

            messagesEl.appendChild(div);
            scrollBottom();
        }

        function setConnected(isOn) {
            dot.classList.toggle("on", isOn);
            statusText.textContent = isOn ? "Connected" : "Disconnected";
            msgInput.disabled = !isOn;
            sendBtn.disabled = !isOn;
        }

        // ---------- Socket (backend se connection) ----------
        const socket = io("ws://localhost:8080/", {
            transports: ["websocket"]
        });

        socket.on("connect", () => {
            setConnected(true);
            addSystem("Server se connect ho gaye ✅");
            if (nameModal.style.display === "none") msgInput.focus();
        });

        socket.on("disconnect", () => {
            setConnected(false);
            addSystem("Server se connection toot gaya ❌");
        });

        socket.on("connect_error", () => {
            setConnected(false);
            statusText.textContent = "Server band hai";
        });

        // Backend events
        socket.on("active", (count) => {
            onlineCount.textContent = "Online: " + count;
        });

        socket.on("chat", (text) => {
            addMessage(text, "theirs", "Server");
        });

        socket.on("join", (text) => {
            addSystem(text);
        });

        socket.on("announce", (text) => {
            addSystem("📢 " + text);
        });

        // ---------- Message bhejna ----------
        chatForm.addEventListener("submit", (e) => {
            e.preventDefault();
            const text = msgInput.value.trim();
            if (!text || !socket.connected) return;

            socket.emit("msg", username + ": " + text); // backend ka "msg" event
            addMessage(text, "mine");
            msgInput.value = "";
            msgInput.focus();
        });

        // ---------- Naam set karna ----------
        function startChat() {
            const val = nameInput.value.trim();
            if (val) username = val;
            nameModal.style.display = "none";
            if (socket.connected) msgInput.focus();
        }

        nameBtn.addEventListener("click", startChat);
        nameInput.addEventListener("keydown", (e) => {
            if (e.key === "Enter") startChat();
        });
    </script>
</body>

</html>
